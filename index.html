<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team Members</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        background: linear-gradient(135deg, #f5f7ff 0%, #edf6ff 100%);
      }
    </style>
  </head>
  <body class="min-h-screen text-slate-800">
    <main class="mx-auto max-w-6xl px-4 py-12">
      <header class="mb-8 text-center">
        <p class="mb-2 text-sm font-semibold uppercase tracking-[0.2em] text-blue-600">
          Team Portfolio
        </p>
        <h1 class="text-3xl font-bold md:text-4xl">メンバー紹介</h1>
      </header>

      <section class="mb-8 flex flex-wrap justify-center gap-3">
        <button
          class="filter-btn rounded-full bg-blue-600 px-5 py-2 text-sm font-semibold text-white shadow hover:bg-blue-500"
          data-role="all"
          type="button"
        >
          全員
        </button>
        <button
          class="filter-btn rounded-full bg-white px-5 py-2 text-sm font-semibold text-slate-700 shadow hover:bg-slate-100"
          data-role="エンジニア"
          type="button"
        >
          エンジニア
        </button>
        <button
          class="filter-btn rounded-full bg-white px-5 py-2 text-sm font-semibold text-slate-700 shadow hover:bg-slate-100"
          data-role="デザイナー"
          type="button"
        >
          デザイナー
        </button>
        <button
          class="filter-btn rounded-full bg-white px-5 py-2 text-sm font-semibold text-slate-700 shadow hover:bg-slate-100"
          data-role="PM"
          type="button"
        >
          PM
        </button>
      </section>

      <section id="member-list" class="grid gap-6 md:grid-cols-2 xl:grid-cols-3"></section>
    </main>

    <script>
      const members = [
        {
          name: '田中 ひかる',
          role: 'PM',
          comment: 'プロジェクト全体を見通しながら、チームが迷わず進められるようにサポートします。'
        },
        {
          name: '佐藤 まな',
          role: 'デザイナー',
          comment: 'ユーザーが使いやすい見た目と体験を大事にして、伝わるデザインをつくります。'
        },
        {
          name: '伊藤 亮',
          role: 'エンジニア',
          comment: '仕様を丁寧にコードに落とし込み、安定して動く仕組みを作るのが得意です。'
        },
        {
          name: '山本 玲奈',
          role: 'エンジニア',
          comment: '細部まで気を配り、改善を重ねながら、快適な体験を目指しています。'
        },
        {
          name: '中村 健',
          role: 'デザイナー',
          comment: 'データやユーザーの声をもとに、伝わりやすい情報整理と表現を考えています。'
        }
      ];

      // 初期順は「プロジェクトの進行に必要な役割の流れ」で並べています。
      // PM → デザイナー → エンジニア → エンジニア → デザイナーの順にすることで、
      // 企画とデザイン、実装の流れが自然に見えるようにしています。
      const memberList = document.getElementById('member-list');
      const filterButtons = document.querySelectorAll('.filter-btn');

      function renderMembers(list) {
        memberList.innerHTML = '';

        list.forEach((member) => {
          const card = document.createElement('article');
          card.className = 'flex h-full flex-col rounded-2xl bg-white p-6 shadow-lg shadow-slate-200/80 ring-1 ring-slate-100';

          const roleBadge = document.createElement('span');
          roleBadge.className = 'mb-4 inline-flex w-fit rounded-full bg-blue-100 px-3 py-1 text-xs font-semibold text-blue-700';
          roleBadge.textContent = member.role;

          const name = document.createElement('h2');
          name.className = 'mb-3 text-2xl font-bold text-slate-900';
          name.textContent = member.name;

          const comment = document.createElement('p');
          comment.className = 'mt-auto text-sm leading-7 text-slate-600';
          comment.textContent = member.comment;

          card.appendChild(roleBadge);
          card.appendChild(name);
          card.appendChild(comment);
          memberList.appendChild(card);
        });
      }

      function applyFilter(filterRole) {
        const filteredMembers = filterRole === 'all'
          ? members
          : members.filter((member) => member.role === filterRole);

        renderMembers(filteredMembers);

        filterButtons.forEach((button) => {
          const isActive = button.dataset.role === filterRole;
          button.classList.toggle('bg-blue-600', isActive);
          button.classList.toggle('text-white', isActive);
          button.classList.toggle('shadow', isActive);
          button.classList.toggle('bg-white', !isActive);
          button.classList.toggle('text-slate-700', !isActive);
        });
      }

      filterButtons.forEach((button) => {
        button.addEventListener('click', () => {
          applyFilter(button.dataset.role);
        });
      });

      renderMembers(members);
    </script>
  </body>
</html>
